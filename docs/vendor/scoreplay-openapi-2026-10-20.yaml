            - video_large
        items:
          type: object
          description: Files keyed by media version ID
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/MediaFormatFile'
          example:
            '252505':
              - id: 5b0f6d0e-0000-4000-8000-000000000001
                type: original
                file_name: match.mov
                size: 1873412096
                mime_type: video/quicktime
                file_url: https://example-bucket.s3.amazonaws.com/624540/match.mov?X-Amz-Expires=86400
                media_version_id: 252505
                status: ready
                is_scoreplay: true
    MediaFormatFile:
      type: object
      required:
        - id
        - type
        - file_name
        - size
        - mime_type
        - media_version_id
        - is_scoreplay
      properties:
        id:
          type: string
          format: uuid
          description: File ID
        type:
          type: string
          description: |
            File type: `original`, `photo`, `compressed`, `thumbnail`, `video_large`,
            `video_medium`, `video_small`, `stream`, `clip`, `sprite`, `sprite_small`,
            `archive` or `unknown`
          example: original
        file_name:
          type: string
          example: match.mov
        size:
          type: integer
          format: int64
          description: File size in bytes; `-1` when the file is not available yet
          example: 1873412096
        mime_type:
          type: string
          example: video/quicktime
        file_url:
          type: string
          description: Presigned URL, valid for 24 hours; omitted when the file cannot be presigned (for example a file on your local storage)
        media_version_id:
          type: integer
          description: ID of the media version the file belongs to; `0` for files not attached to a version
          example: 252505
        status:
          type: string
          description: File processing status; omitted when empty
          example: ready
        is_scoreplay:
          type: boolean
          description: True when the file is stored on ScorePlay storage, false on your own storage
