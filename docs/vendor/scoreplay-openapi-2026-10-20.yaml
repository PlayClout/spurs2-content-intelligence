  # Team-season associations CR
  /team-seasons:
    post:
      summary: Attach a team to a season
      description: |
        Register a team in a season and return the resulting team-season association.

        The `id` in the response is the team-season association ID, **not** the team ID. It
        is the value [List players](#tag/operation/listPlayersPublic) accepts as
        `team_season_id`, and the one the ScorePlay web app uses at
        `https://<your-org>.scoreplay.io/team/<id>`.

        ## Notes
        - The call is idempotent: re-posting a pair that is already associated returns the
          existing association rather than creating a second one.
        - A `team_id` or `season_id` belonging to another organization returns `404`.
        - This endpoint requires the `can_do_team_create_team` permission. A key without it
          gets `401`, the same as an invalid key.
      operationId: createTeamSeasonPublic
      tags:
        - Team Seasons
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamSeasonRequest'
      responses:
        '201':
          description: Association created, or the existing one returned when the pair was
            already associated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSeason'
        '400':
          description: Malformed JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required, invalid API key, or a key without the
            `can_do_team_create_team` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Team or season not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error, or a required field (`team_id`, `season_id`) is
            missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List team-season associations
      description: |
        Retrieve the team-season associations for your organization, newest first. The
        response is a paginated envelope carrying `items` and a `total` count, not a bare
        array.

        Use this to turn a team ID into the association IDs that
        [List players](#tag/operation/listPlayersPublic) accepts as `team_season_id`.

        ## Notes
        - `team_id` and `season_id` combine as an AND, so supplying both returns at most one
          association.
        - Associations are ordered by `id` descending.
      operationId: listTeamSeasonsPublic
      tags:
        - Team Seasons
      parameters:
        - name: team_id
          in: query
          description: Return only the associations of this ScorePlay team
          schema:
            type: integer
            example: 3623
        - name: season_id
          in: query
          description: Return only the associations belonging to this season
          schema:
            type: integer
            example: 12
        - name: page
          in: query
          description: Page number, 1-based
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: limit
          in: query
          description: Number of associations per page
          schema:
            type: integer
            minimum: 1
            default: 50
            example: 50
      responses:
        '200':
          description: Successfully retrieved team-season associations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTeamSeasons'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /team-seasons/{id}:
    get:
      summary: Get a team-season association by ID
      description: |
        Retrieve a single team-season association by its ID. An association belonging to
        another organization returns `404`, the same as one that does not exist.
      operationId: getTeamSeasonPublic
      tags:
        - Team Seasons
      parameters:
        - name: id
          in: path
          required: true
          description: Team-season association ID
          schema:
            type: integer
            example: 27366
      responses:
        '200':
          description: Successfully retrieved the association
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamSeason'
        '400':
          description: Invalid association ID (non-numeric or zero)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Team-season association not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /team-seasons/{id}/players:
    post:
      summary: Attach players to a squad
      description: |
        Attach a batch of players to a team-season association, building that season's squad.
        The call reports what it did per player rather than returning a bare success flag,
        so a partially-correct batch tells you exactly which IDs were new, which were
        already there, and which did not resolve.

        `id` is the **team-season association ID**, the value
        [List team-season associations](#tag/operation/listTeamSeasonsPublic) returns and
        [List players](#tag/operation/listPlayersPublic) accepts as `team_season_id`. It is
        not a team ID.

        ## Reading the response

        Every ID you sent comes back in exactly one bucket:

        | Bucket | Meaning |
        |---|---|
        | `attached` | Newly attached by this call (or, on a dry run, would be) |
        | `already_present` | Already in this squad, left untouched |
        | `not_found` | No player with that ID in your organization |

        A player that exists in another organization is reported as `not_found`, never
        attached, even if you hold its ID.

        ## Notes
        - **Idempotent.** Re-posting the same squad reports everything as `already_present`
          and writes nothing.
        - **`dry_run: true`** returns the identical report without writing, so a client-side
          spreadsheet can be validated before it is committed.
        - **Duplicate and zero IDs are dropped** before the diff, so they never appear in
          the response.
        - **Batches are capped at 500 IDs** and an oversized batch is rejected outright,
          not truncated.
        - There is no matching read or delete endpoint. Read the squad with
          `GET /v1/players?team_season_id={id}`, which is paginated.
        - This endpoint requires the `can_do_team_edit_player/team` permission. A key
          without it gets `401`, the same as an invalid key.
      operationId: attachPlayersToTeamSeasonPublic
      tags:
        - Team Seasons
      parameters:
        - name: id
          in: path
          required: true
          description: Team-season association ID
          schema:
            type: integer
            example: 27366
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachSquadPlayersRequest'
      responses:
        '200':
          description: |
            The batch was processed. Returned for a real write, for a dry run, and when
            every requested player was already present, so check `attached` rather than the
            status code to tell whether anything changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachSquadPlayersResponse'
        '400':
          description: Malformed JSON body, invalid association ID, `player_ids` containing
            nothing but zeros, or more than 500 IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required, invalid API key, or a key without the
            `can_do_team_edit_player/team` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Team-season association not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error, or `player_ids` is missing or an empty array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Events CRUD
  /event:
    post:
      summary: Create an event
      description: |
        Create a new event for your company. An event is the match or collection entity that
        media/clips are filed into. Tags and players can be attached in the same call, and events
        can be nested under a parent event to build a hierarchy (e.g. competition/round/match).

        Note this is an upsert: when an event already exists with the same `external_id`, or the
        same `parent_id` + `name` + `date`, that event is updated instead of a new one created.
      operationId: createEventPublic
      tags:
        - Events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '200':
          description: Event created (or updated) successfully. In this response the
            `tag_options` array contains ID-only stubs (all other tag option fields
            are zero values).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /event/{id}:
    patch:
      summary: Update an event
      description: |
        Update an existing event's name, date, external ID, league/competition identifier, or
        raw name. This is a partial update: send only the fields you want to change.
      operationId: updateEventPublic
      tags:
        - Events
      parameters:
        - name: id
          in: path
          required: true
          description: Event ID
          schema:
            type: integer
            example: 321801
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Event updated successfully. Empty-string and zero values are
            ignored (they cannot clear a value), except `raw_name`, which is applied
            whenever the key is present. Returns the updated event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Invalid request body, invalid event ID, or no applicable field
            to update (`no fields to update`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /streams/schedules:
    get:
      summary: List live schedules
      description: |
        Retrieve the live schedules of your organization. A live schedule books a recording
        of a live source (a stream, a stream group, a pull receiver or an SRT caller) between
        a `start` and an `end`, and files the result into a collection. The response is a
        paginated envelope carrying `items` and a `total` count, not a bare array.

        ## Filtering
        - `name` matches the schedule name as a case-insensitive substring.
        - `start_date` and `end_date` both bound the schedule's `start` (Unix seconds).
        - `date` returns the schedules starting on that UTC day (`YYYY-MM-DD`).
        - `status` matches the status stored by the ingest pipeline. Older schedules that
          predate it carry no stored status and never match this filter.
        - Filters combine: supplying several returns the schedules matching all of them.

        ## Notes
        - Without `order_by`, the newest schedules come first.
      operationId: listStreamSchedulesPublic
      tags:
        - Live Schedules
      parameters:
        - name: stream_id
          in: query
          description: Return only the schedules recording this stream
          schema:
            type: integer
            example: 42
        - name: stream_ids
          in: query
          description: Return only the schedules recording one of these streams. Ignored when
            `stream_id` is set.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: integer
            example: [42, 43]
        - name: collection_id
          in: query
          description: Return only the schedules filing into this collection
          schema:
            type: integer
            example: 1234
        - name: name
          in: query
          description: Return only the schedules whose name contains this string
          schema:
            type: string
            example: "court 1"
        - name: status
          in: query
          description: Return only the schedules in this status
          schema:
            $ref: '#/components/schemas/StreamScheduleStatus'
        - name: date
          in: query
          description: Return only the schedules starting on this UTC day
          schema:
            type: string
            format: date
            example: "2026-10-04"
        - name: start_date
          in: query
          description: Return only the schedules starting at or after this time (Unix seconds)
          schema:
            type: integer
            format: int64
            example: 1791158400
        - name: end_date
          in: query
          description: Return only the schedules starting at or before this time (Unix seconds)
          schema:
            type: integer
            format: int64
            example: 1791244800
        - name: order_by
          in: query
          description: Sort field. Omitted, schedules come newest first.
          schema:
            type: string
            enum: [name, start, end]
        - name: sort
          in: query
          description: Sort direction for `order_by`
          schema:
            type: string
            enum: [ASC, DESC]
            default: ASC
        - name: page
          in: query
          description: Page number, 1-based
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: limit
          in: query
          description: Number of schedules per page
          schema:
            type: integer
            minimum: 1
            default: 50
            example: 50
      responses:
        '200':
          description: Successfully retrieved live schedules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStreamSchedules'
        '400':
          description: A malformed query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: ERR_INVALID_QUERY
        '401':
          description: Unauthorized - invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Create a live schedule
      description: |
        Book a recording of a live source. Give exactly one source:

        | Source | Fields |
        |---|---|
        | A stream | `stream_id` |
        | A stream group | `stream_group_id` |
        | A pull receiver | `pull_receiver_id` |
        | An SRT caller | `use_caller: true` and `srt_destination` |

        The schedule is picked up by the recorder at `start`; nothing else needs to be
        triggered.

        Requires the `can_do_livestream_schedule` permission on your API key.

        ## Notes
        - The source cannot be changed afterwards. To record another source, delete the
          schedule and create a new one.
        - A `pull_receiver_id` forces `use_caller` to `true`.
        - Duplicate `tag_option_ids` are ignored.
        - A stream, stream group, pull receiver, collection, live preset or tag option
          belonging to another organization returns `404`, the same as one that doesn't
          exist.
      operationId: createStreamSchedulePublic
      tags:
        - Live Schedules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStreamScheduleRequest'
            example:
              name: Final - Court 1
              start: 1791200000
              end: 1791207200
              stream_id: 42
              collection_id: 1234
              preset_id: 7
              tag_option_ids: [11, 12]
      responses:
        '201':
          description: Live schedule created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamSchedule'
        '400':
          description: Malformed JSON body, a missing `name` or `start`, an `end` not after
            `start`, no source, or more than one source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing API key, or the key lacks the
            `can_do_livestream_schedule` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: A referenced stream, stream group, pull receiver, collection, live
            preset or tag option is unknown or belongs to another organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: STREAM_NOT_FOUND
        '500':
          $ref: '#/components/responses/InternalServerError'

  /streams/schedules/{id}:
    get:
      summary: Get a live schedule by ID
      description: |
        Retrieve one live schedule of your organization.

        Requires the `can_view_media_stream` permission on your API key.

        ## Notes
        - A schedule ID belonging to another organization returns `404`, the same as one
          that doesn't exist.
      operationId: getStreamSchedulePublic
      tags:
        - Live Schedules
      parameters:
        - name: id
          in: path
          required: true
          description: Live schedule ID
          schema:
            type: integer
            example: 9012
      responses:
        '200':
          description: Successfully retrieved the live schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamSchedule'
        '400':
          description: Invalid schedule ID (non-numeric or zero)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing API key, or the key lacks the
            `can_view_media_stream` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Live schedule not found - unknown ID, or one belonging to another
            organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: ERR_STREAM_SCHEDULE_NOT_FOUND
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Update a live schedule
      description: |
        Partially update a live schedule: only the fields sent change, omitted fields keep
        their value. The source (`stream_id`, `stream_group_id`, `pull_receiver_id`,
        `use_caller`, `srt_destination`) cannot be changed.

        Requires the `can_do_livestream_schedule` permission on your API key.

        ## While the schedule is live
        A schedule is live while its `status` is `FEED_DETECTED` or `LIVE`. `start` and
        `preset_id` configure the running ingest, so changing either returns `409`. `name`,
        `end`, `collection_id`, `is_private`, `available_user_type_ids` and `tag_option_ids`
        stay editable.

        ## Notes
        - `tag_option_ids` and `available_user_type_ids` replace the current list; send an
          empty array to clear it.
        - `collection_id` cannot be cleared, only moved to another collection.
        - A schedule ID, collection, live preset or tag option belonging to another
          organization returns `404`, the same as one that doesn't exist.
      operationId: updateStreamSchedulePublic
      tags:
        - Live Schedules
      parameters:
        - name: id
          in: path
          required: true
          description: Live schedule ID
          schema:
            type: integer
            example: 9012
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStreamScheduleRequest'
            example:
              name: Final - Court 1 (extended)
              end: 1791210800
      responses:
        '200':
          description: Live schedule updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamSchedule'
        '400':
          description: Invalid schedule ID, malformed JSON body, an empty `name`, a zero
            `start` or `collection_id`, or an `end` not after `start`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing API key, or the key lacks the
            `can_do_livestream_schedule` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Schedule, collection, live preset or tag option unknown or belonging
            to another organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: ERR_STREAM_SCHEDULE_NOT_FOUND
        '409':
          description: '`start` or `preset_id` changed while the schedule is live'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: start and preset_id cannot be changed while the stream schedule is live
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete a live schedule
      description: |
        Delete a live schedule that is not live. The media it already recorded are kept.

        Requires the `can_do_livestream_schedule` permission on your API key.

        ## Notes
        - A schedule whose `status` is `FEED_DETECTED` or `LIVE` cannot be deleted and
          returns `409`. `SCHEDULED`, `PROBING` and `RECORDED` schedules can.
        - A schedule ID belonging to another organization returns `404`, the same as one
          that doesn't exist.
      operationId: deleteStreamSchedulePublic
      tags:
        - Live Schedules
      parameters:
        - name: id
          in: path
          required: true
          description: Live schedule ID
          schema:
            type: integer
            example: 9012
      responses:
        '204':
          description: Live schedule deleted successfully
        '400':
          description: Invalid schedule ID (non-numeric or zero)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing API key, or the key lacks the
            `can_do_livestream_schedule` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Live schedule not found - unknown ID, or one belonging to another
            organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: ERR_STREAM_SCHEDULE_NOT_FOUND
        '409':
          description: The schedule is currently live
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: stream schedule is currently live
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-ScorePlay-Api-Key
      description: Paste your API key in the **Value** field below.

  responses:
    Unauthorized:
      description: Authentication required or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    TranscriptSegment:
      type: object
      description: A timecoded portion of a transcript
      required:
        - start
        - end
        - text
      properties:
        start:
          type: number
          format: double
          description: Start offset in seconds from the beginning of the media
          example: 12.4
        end:
          type: number
          format: double
          description: End offset in seconds from the beginning of the media
          example: 15.6
        text:
          type: string
          example: "We knew it would be a difficult night."
        speaker:
          type: string
          description: Speaker label. Omitted when the segment has no identified speaker.
          example: "Kylian Mbappe"

    Transcript:
      type: object
      description: A media's transcript in one language
      properties:
        language:
          type: string
          description: The language this transcript is in
          example: french
        is_source:
          type: boolean
          description: True for the transcript in the language spoken in the media; false for
            translations of it
          example: false
        segments:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptSegment'

    MediaTranscripts:
      type: object
      description: Every transcript held for a media
      properties:
        media_id:
          type: integer
          format: uint
          example: 12345
        source_language:
          type: string
          description: Language of the source transcript. Empty when the media has no
            transcripts.
          example: english
        transcripts:
          type: array
          items:
            $ref: '#/components/schemas/Transcript'

    PushTranscriptRequest:
      type: object
      description: A complete transcript for one language
      required:
        - segments
      properties:
        segments:
          type: array
          minItems: 1
          description: The full set of segments for this language. Must not be empty; each
            segment needs non-empty `text`, and `end` must not precede `start`.
          items:
            $ref: '#/components/schemas/TranscriptSegment'

    MediaMoveRequest:
      type: object
      required:
        - event_id
        - media_ids
      properties:
        event_id:
          type: integer
          format: uint
          description: The destination event (collection) ID
          example: 24062
        media_ids:
          type: array
          description: The media to move (1 to 500 IDs)
          minItems: 1
          maxItems: 500
          items:
            type: integer
            format: uint
            minimum: 1
          example: [628206]

    MediaMoveAccepted:
      type: object
      properties:
        operation_id:
          type: integer
          format: uint
          description: Poll it with `GET /operation/{id}`
          example: 10122

    PublicOperationStatus:
      type: object
      properties:
        id:
          type: integer
          format: uint
          example: 10122
        action:
          type: string
          description: What the operation does, e.g. `move_media`
          example: move_media
        status:
          type: string
          description: Current state of the operation
          enum:
            - pending
            - done
            - error
          example: done
        error_value:
          type: string
          description: Why the operation failed; only present when `status` is `error`
          example: the media could not be moved

    PublicMediaUpdatePayload:
      type: object
      description: Payload for updating media details
      properties:
        name:
          type: string
          description: Media name/title
          example: Championship Game Highlights
          nullable: true
        description:
          type: string
          description: Media description
          example: Key moments from the championship game
          nullable: true
        date:
          type: integer
          format: int64
          description: Unix timestamp for media date
          example: 1642275000
          nullable: true
        captured_time:
          type: string
          description: When the media was captured (string format)
          example: '2024-01-15T19:30:00Z'
          nullable: true
        event_id:
          type: integer
          format: uint
          description: ID of the event this media belongs to
          example: 456
          nullable: true
        label_id:
          type: integer
          format: uint
          description: ID of the label for this media
          example: 789
          nullable: true
        player_accessible:
          type: boolean
          description: Whether players can access this media
          example: true
          nullable: true
        team_accessible:
          type: boolean
          description: Whether the team can access this media
          example: true
          nullable: true
        accessible_from:
          type: integer
          format: uint64
          description: Unix timestamp from when media becomes accessible
          example: 1642275000
          nullable: true
        accessible_until:
          type: integer
          format: uint64
          description: Unix timestamp until when media is accessible
          example: 1672811000
          nullable: true
        timecode:
          type: string
          description: >-
            Start timecode of the video, as `HH:MM:SS` or `HH:MM:SS:FF`
            (a semicolon before the frames, `HH:MM:SS;FF`, is accepted for
            drop-frame timecodes). Hours must be `00`-`23`, minutes and seconds
            `00`-`59`; any other value fails the request with `400`. Only
            applies to video media. Setting it changes how Unix-based video
            log offsets are resolved for that video.
          example: '10:15:30:00'
        media_version_id:
          type: integer
          format: uint
          description: >-
            Which version of the video the `timecode` applies to. Requires
            `timecode` to be set and must be greater than `0`, otherwise the
            request fails with `400`. When omitted, the media's default
            (favourite) version is used.
          example: 321

    UpdateMediaTagsPayload:
      type: object
      description: Payload for updating media tags
      properties:
        tag_option_ids:
          type: array
          description: List of tag option IDs to add/remove
          items:
            type: integer
            format: uint
          example:
            - 123
            - 456
            - 789
        player_ids:
          type: array
          description: List of player IDs to tag/untag
          items:
            type: integer
            format: uint
          example:
            - 111
            - 222
            - 333
        sponsor_ids:
          type: array
          description: List of sponsor IDs to tag/untag
          items:
            type: integer
            format: uint
          example:
            - 444
            - 555
            - 666
        external_player_ids:
          type: array
          description: External IDs of players to tag/untag (resolved to players of
            your organization)
          items:
            type: string
          example:
            - psg29

    Error:
      type: object
      properties:
        message:
          type: string
          description: Error name or type
          example: USER_NOT_FOUND

    User:
      type: object
      description: |
        A user within your organization. This is an explicit allowlist: the phone number,
        password, and tokens are never returned.
      properties:
        id:
          type: integer
          description: Unique identifier for the user
          example: 42
        company_id:
          type: integer
          description: ID of the organization the user belongs to
          example: 123
        first_name:
          type: string
          description: The user's first name, stored lowercased
          example: camille
        last_name:
          type: string
          description: The user's last name, stored lowercased
          example: dupont
        email:
          type: string
          format: email
          description: The user's email address, stored lowercased
          example: camille.dupont@psg.fr
        user_permission_id:
          type: integer
          description: ID of the user's [account type](#tag/operation/getAccountTypePublic)
          example: 3
        user_permission_name:
          type: string
          description: Name of the user's account type. Omitted when the permission
            could not be resolved.
          example: Club
        player_id:
          type: integer
          description: ID of the player this user is linked to, 0 when none
          example: 0
        status:
          type: string
          description: "Account status: `validated`, `pending`, `refused`, or `deactivated`"
          example: validated
        company_name:
          type: string
          description: Name of the organization the user belongs to
          example: Paris Saint-Germain
        external_group_id:
          type: integer
          description: ID of the user's [external group](#tag/operation/getExternalGroupPublic),
            0 when none. Called `sponsor_id` in the underlying data model - same concept,
            renamed for this response.
          example: 0
        external_group_name:
          type: string
          description: Name of the user's external group. Omitted when the user has none.
          example: Nike
        created_at:
          type: string
          format: date-time
          description: Creation timestamp (ISO8601)
          example: 2024-08-28T08:00:43.518554Z

    PaginatedUsers:
      type: object
      description: Paginated list of users
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
          format: int64
          description: Total number of users matching the filters, across all pages.
            Omitted when no user matches.
          example: 124
        page:
          type: integer
          format: int64
          description: Page returned, 1-based
          example: 1
        limit:
          type: integer
          format: int64
          description: Page size used
          example: 50

    AccountType:
      type: object
      description: |
        An account type: the permission set given to a group of users (what some systems
        call a "role").
      properties:
        id:
          type: integer
          description: Account type ID, carried by users as `user_permission_id`
          example: 8
        name:
          type: string
          description: Account type name
          example: sponsor
        is_external:
          type: boolean
          description: Whether the account type is for people outside your organization.
            Its users only see the folders explicitly shared with them, and media shared
            with the whole organization is not shared with them.
          example: true
        hidden:
          type: boolean
          description: Whether the account type is hidden in the ScorePlay dashboard
          example: false
        locked:
          type: boolean
          description: Whether the account type is a built-in one that cannot be deleted
          example: true
        only_shared_content:
          type: boolean
          description: Whether users who join with this account type only see the media
            shared with them directly
          example: false
        require_team_association:
          type: boolean
          description: Whether users of this account type must be associated with a team
          example: false
        permissions:
          type: array
          description: The permissions the account type grants
          items:
            type: string
          example: [can_view_media, can_do_media_download, can_view_events]
        terms_and_conditions_url:
          type: string
          description: Terms and conditions users of this account type accept. Empty when
            none.
          example: ""

    PaginatedAccountTypes:
      type: object
      description: Paginated list of account types
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountType'
        total:
          type: integer
          format: int64
          description: Total number of account types matching the filters, across all
            pages. Omitted when no account type matches.
          example: 9
        page:
          type: integer
          format: int64
          description: Page returned, 1-based
          example: 1
        limit:
          type: integer
          format: int64
          description: Page size used
          example: 50

    ExternalGroup:
      type: object
      description: |
        An external group: people from outside your organization, such as a sponsor, a
        broadcaster or a rights holder. Called a *sponsor* in the
        underlying data model.
      properties:
        id:
          type: integer
          description: External group ID, carried by users as `external_group_id`
          example: 17
        name:
          type: string
          description: Name used to recognize the group in media, stored lowercased
          example: nike
        label:
          type: string
          description: Display name of the group
          example: Nike
        account_type_id:
          type: integer
          description: ID of the group's [account type](#tag/operation/getAccountTypePublic),
            0 when none
          example: 8
        account_type:
          type: string
          description: Name of the group's account type. Omitted when the group has none.
          example: sponsor
        active:
          type: boolean
          description: Whether the group is active
          example: true
        logo:
          type: string
          description: URL of the group's logo. Empty when none.
          example: https://example.com/nike-logo.png
        terms_and_conditions_url:
          type: string
          description: Terms and conditions the group's members accept. Empty when none.
          example: ""

    CreateExternalGroupRequest:
      type: object
      description: Request to create an external group
      required:
        - name
        - account_type_id
      properties:
        name:
          type: string
          description: Name of the group, unique in your organization. Stored trimmed and
            lowercased, and kept as sent as the group's `label`.
          example: Nike
        account_type_id:
          type: integer
          description: ID of the group's [account type](#tag/operation/listAccountTypesPublic)
          example: 8
        active:
          type: boolean
          default: true
          description: Whether the group is active
          example: true
        logo:
          type: string
          format: uri
          description: http(s) URL of the group's logo
          example: https://example.com/nike-logo.png
        terms_and_conditions_url:
          type: string
          format: uri
          description: http(s) URL of the terms and conditions the group's members accept
          example: https://example.com/nike-terms

    UpdateExternalGroupRequest:
      type: object
      description: Request to update an external group. Send at least one field.
      minProperties: 1
      properties:
        name:
          type: string
          description: New name of the group, unique in your organization. Stored trimmed
            and lowercased, and kept as sent as the group's `label`.
          example: Nike Football
        active:
          type: boolean
          description: Whether the group is active
          example: false
        logo:
          type: string
          format: uri
          description: http(s) URL of the group's new logo
          example: https://example.com/nike-logo.png
        terms_and_conditions_url:
          type: string
          format: uri
          description: http(s) URL of the terms and conditions the group's members accept
          example: https://example.com/nike-terms

    PaginatedExternalGroups:
      type: object
      description: Paginated list of external groups
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExternalGroup'
        total:
          type: integer
          format: int64
          description: Total number of external groups matching the filters, across all
            pages. Omitted when no external group matches.
          example: 4
        page:
          type: integer
          format: int64
          description: Page returned, 1-based
          example: 1
        limit:
          type: integer
          format: int64
          description: Page size used
          example: 50

    AccessTag:
      type: object
      description: |
        One access rule of an external group. It points at exactly one of a tag option, a
        player or another external group, and its `type` says how it combines with the
        group's other access tags.
      properties:
        ID:
          type: integer
          description: Access tag ID
          example: 311
        CreatedAt:
          type: string
          format: date-time
          example: 2025-02-11T09:14:03.201845Z
        UpdatedAt:
          type: string
          format: date-time
          example: 2025-02-11T09:14:03.201845Z
        DeletedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        sponsor_id:
          type: integer
          description: ID of the external group the access tag belongs to
          example: 17
        player_user_id:
          type: integer
          nullable: true
          description: ID of the player user the access tag is tied to, when any
          example: null
        tag_option_id:
          type: integer
          description: ID of the tag option this rule points at, 0 when none
          example: 5521
        tag_sponsor_id:
          type: integer
          description: ID of the external group this rule points at, 0 when none
          example: 0
        player_id:
          type: integer
          description: ID of the player this rule points at, 0 when none
          example: 0
        type:
          type: string
          enum: [OR, AND, NOT]
          description: How the rule combines with the group's other access tags
          example: OR

    TagFilter:
      type: object
      description: |
        A tag filter (tag group) and the tag options that belong to it. The `id` is a stable
        identifier suitable for mapping integrations; it does not change when the filter is renamed.
      properties:
        id:
          type: integer
          description: Stable identifier for the tag filter (group)
          example: 7
        name:
          type: string
          description: Display name of the tag filter (group)
          example: Score
        tag_options:
          type: array
          description: |
            IDs of the tag options that belong to this filter. Empty when the filter has no tag
            options. The same tag option ID may appear under more than one filter.
          items:
            type: integer
          example: [42, 57]

    TagFilterListResponse:
      type: object
      description: Paginated list of tag filters (tag groups)
      properties:
        items:
          type: array
          description: Tag filters for the current page
          items:
            $ref: '#/components/schemas/TagFilter'
        total:
          type: integer
          description: Total number of tag filters matching the request. Omitted
            when there are no matches.
          example: 12
        page:
          type: integer
          description: Current page number (1-based)
          example: 1
        limit:
          type: integer
          description: Number of results per page
          example: 50

    TagFilterPublicResponse:
      type: object
      description: |
        A tag filter (tag group) as returned by Create, Get, and Update. This is
        intentionally a minimal DTO, and intentionally different from
        [List tag filters](#tag/operation/listTagFiltersPublic): it does not carry
        `tag_options` — the attached options have no correct value to return on a
        single-item read, so the field is dropped entirely rather than sent empty or
        null. List what's attached with
        [List tag filter options](#tag/operation/listTagFilterOptionsPublic) instead.
      properties:
        id:
          type: integer
          description: Stable identifier for the tag filter (group)
          example: 7
        name:
          type: string
          description: Display name of the tag filter (group)
          example: Score

    TagFilterOptionListResponse:
      type: object
      description: Paginated list of the tag options attached to a tag filter, in position order
      properties:
        items:
          type: array
          description: Tag options for the current page
          items:
            $ref: '#/components/schemas/TagOption'
        total:
          type: integer
          description: Total number of tag options attached to this filter. Omitted
            when there are no matches.
          example: 3
        page:
          type: integer
          description: Current page number (1-based)
          example: 1
        limit:
          type: integer
          description: Number of results per page
          example: 50

    TagOption:
      type: object
      description: Tag option representing a ScorePlay tag
      properties:
        ID:
          type: integer
          description: Unique identifier for the tag option
          example: 1910925
        CreatedAt:
          type: string
          format: date-time
          description: Creation timestamp (ISO8601)
          example: 2024-08-28T08:00:43.518554Z
        UpdatedAt:
          type: string
          format: date-time
          description: Last update timestamp (ISO8601)
          example: 2024-08-28T08:00:43.518554Z
        DeletedAt:
          type: string
          format: date-time
          nullable: true
          description: Deletion timestamp if soft-deleted, otherwise null
        name:
          type: string
          description: Internal name of the tag option
          example: parc des princes
        label:
          type: string
          description: Display label for the tag option
          example: Parc des Princes
        company_id:
          type: integer
          description: Associated company ID
          example: 123
        is_metadata:
          type: boolean
          description: Whether this tag is used as metadata
        is_event:
          type: boolean
          description: Whether this tag option is used as an event tag
        type:
          type: string
          description: Tag type. Free-form string; common values are metadata, free,
            credit, size. May be empty.
          example: metadata
        color:
          type: string
          description: Display color for the tag option. May be empty.
          example: ""
        emoji:
          type: string
          description: Emoji associated with the tag option. May be empty.
          example: ""
        count:
          type: integer
          description: Computed usage counter. Only populated on some endpoints
            (e.g. tag search), otherwise 0.
          example: 0
        total:
          type: integer
          description: Computed total counter. Only populated on some endpoints,
            otherwise 0.
          example: 0
        translations:
          type: array
          description: Translations of the tag option. Omitted when empty.
          items:
            type: object
            properties:
              ID:
                type: integer
                example: 42
              CreatedAt:
                type: string
                format: date-time
              UpdatedAt:
                type: string
                format: date-time
              DeletedAt:
                type: string
                format: date-time
                nullable: true
              tag_option_id:
                type: integer
                example: 1910925
              language:
                type: string
                example: fr
              translation:
                type: string
                example: but
        synonyms:
          type: array
          description: Synonyms of the tag option. Omitted when empty.
          items:
            type: object
            properties:
              ID:
                type: integer
                example: 42
              CreatedAt:
                type: string
                format: date-time
              UpdatedAt:
                type: string
                format: date-time
              DeletedAt:
                type: string
                format: date-time
                nullable: true
              tag_option_id:
                type: integer
                example: 1910925
              synonym:
                type: string
                example: score

    Player:
      type: object
      description: |
        Player entity with personal and team information. Names are stored and
        returned lowercased. Association fields (`tag_options`, `sponsors`,
        `Teams`, `Managers`, `Company`, `access_tags`) are `null` unless the
        endpoint preloads them (GET/PUT /players/{id} populate `tag_options`,
        `sponsors`, `Teams`, and `Managers`).
      properties:
        ID:
          type: integer
          description: Unique identifier for the player
          example: 189111
        CreatedAt:
          type: string
          format: date-time
          description: Creation timestamp (ISO8601)
          example: 2024-09-05T06:34:38.890566Z
        UpdatedAt:
          type: string
          format: date-time
          description: Last update timestamp (ISO8601)
          example: 2025-06-23T17:36:34.978456Z
        DeletedAt:
          type: string
          format: date-time
          nullable: true
          description: Deletion timestamp if soft-deleted, otherwise null
        first_name:
          type: string
          description: Player's first name (stored lowercased)
          example: bradley
        last_name:
          type: string
          description: Player's last name (stored lowercased)
          example: barcola
        full_name:
          type: string
          description: Player's full name (stored lowercased)
          example: bradley barcola
        company_id:
          type: integer
          description: Associated company ID
          example: 123
        token:
          type: string
          description: Internal player token. May be empty.
        profile_picture:
          type: string
          description: URL to the player's profile picture
          example: https://img.uefa.com/imgml/TP/players/2014/2025/324x324/250134138.jpg
        profile_picture_ai:
          type: string
          description: URL of the picture used for AI face recognition. May be empty.
        profile_picture_thumb:
          type: string
          description: URL of the profile picture thumbnail. May be empty, including for
            a few minutes after the headshot changes, while it is regenerated.
        api_player_id:
          type: integer
          description: Legacy API player reference, 0 when unset
          example: 0
        run_ai:
          type: boolean
          description: Whether AI tagging runs for this player
        run_facial_ai:
          type: boolean
          description: Whether facial recognition runs for this player
        ai_name:
          type: string
          description: Name used by AI tagging. May be empty.
        ai_threshold:
          type: integer
          description: Confidence threshold for AI tagging
