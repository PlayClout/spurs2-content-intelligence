          example: Paris Saint-Germain
        company_id:
          type: integer
          description: Associated company ID
          example: 123
        tag_option_id:
          type: integer
          description: ID of the tag option backing this team (type `team`)
          example: 1910925
        external_id:
          type: string
          description: External identifier for the team
          example: psg
        vip:
          type: boolean
          description: Whether the team is flagged as VIP
        auto_share_player:
          type: boolean
          description: Whether media tagged with the team is auto-shared to its players
        auto_share_sponsor:
          type: boolean
          description: Whether media tagged with the team is auto-shared to its sponsors
        default_player_app_access:
          type: boolean
          description: Default app access for players created in this team
        tag_options:
          type: array
          nullable: true
          description: Tag options linked to the team. Null unless preloaded.
