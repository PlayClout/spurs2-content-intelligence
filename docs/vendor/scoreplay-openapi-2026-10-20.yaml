        Create a season for your organization. A season is the time window a team is
        registered for; attaching a team to it with
        [Attach a team to a season](#tag/operation/createTeamSeasonPublic) produces the
        team-season association that rosters are keyed on.

        ## Notes
        - `name` is trimmed and lowercased before it is stored, so `"  2025/26  "` comes
          back as `2025/26`. A name that is blank once trimmed is rejected.
        - A tag option of type `season` is created alongside the season, so it can be used
          as a media filter straight away.
        - This endpoint requires the `can_do_team_create_season` permission. A key without
          it gets `401`, the same as an invalid key.
      operationId: createSeasonPublic
      tags:
        - Seasons
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSeasonRequest'
      responses:
        '201':
          description: Season created successfully. The stored name is the trimmed,
            lowercased form of the one you sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Season'
        '400':
          description: Malformed JSON body, a `name` that is blank once trimmed, or a
            `start_date` after `end_date`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required, invalid API key, or a key without the
            `can_do_team_create_season` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error, or the required `name` field is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List seasons
      description: |
        Retrieve the seasons for your organization, most recently ending first. The response
        is a paginated envelope carrying `items` and a `total` count, not a bare array.

        ## Notes
        - `query` matches the season name as a substring, case- and accent-insensitively.
        - Seasons are ordered by `end_date` descending.
      operationId: listSeasonsPublic
      tags:
        - Seasons
      parameters:
        - name: query
          in: query
          description: Filter seasons whose name contains this string
          schema:
            type: string
            example: "2025"
        - name: page
          in: query
          description: Page number, 1-based
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: limit
          in: query
          description: Number of seasons per page
          schema:
            type: integer
            minimum: 1
            default: 50
            example: 50
      responses:
        '200':
          description: Successfully retrieved seasons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSeasons'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /seasons/{id}:
    get:
