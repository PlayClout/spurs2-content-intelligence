  /upload/event/{id}:
    post:
      summary: Create media upload into event
      description: |
        Initialize media upload process for a specific event. This endpoint creates media records and generates upload URLs for multipart uploads to cloud storage.

        ## Upload Process
        1. Call this endpoint to create media record and get upload parameters
        2. Upload file parts using the returned upload URLs
        3. Call `/upload/complete/{id}` to finalize the upload
      operationId: createPublicMediaIntoEvent
      parameters:
        - name: id
          in: path
          description: Event ID where the media will be uploaded
          required: true
          schema:
            type: integer
            format: int64
            example: 12345
        - name: parts
          in: query
          description: Number of parts for multipart upload
          required: true
          schema:
            type: integer
            minimum: 1
            example: 5
      requestBody:
        description: Media creation payload
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaPayload'
      responses:
        '200':
          description: Successfully created media and returned upload information
          content:
            application/json:
              schema:
                type: object
                properties:
                  upload_id:
                    type: string
                    description: Unique identifier for the multipart upload
                    example: abc123xyz
                  key:
                    type: string
                    description: Storage key/path for the file
                    example: 123/456/media_789_1.jpg
                  urls:
                    type: array
                    description: Pre-signed upload descriptors, one per part
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          format: uri
                          description: Pre-signed URL for uploading this part
                        etag:
                          type: string
                          description: Always empty on creation; filled by S3 after upload
                          example: ""
                        parts_number:
                          type: integer
                          description: Part index this URL uploads
                          example: 1
                  media_id:
                    type: integer
                    description: ID of the created media record
                    example: 789
                  media_version_id:
                    type: integer
                    description: ID of the media version, 0 when uploading a new media
                    example: 0
        '400':
          description: Invalid request (bad event ID or missing `parts` query parameter)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Upload

  /upload/complete/{id}:
    post:
      summary: Complete multipart upload
      description: |
        Finalize a multipart upload by providing the upload parts information. This endpoint completes the multipart upload process and creates the final file record.

        ## Completion Process
        - Combines the uploaded parts into the final file in cloud storage
        - Creates the file record in the database
        - Updates the media (or media version) with the file information
      operationId: completeS3MultipartUploadUnauth
      parameters:
        - name: id
          in: path
          description: Media ID for which to complete the upload
          required: true
          schema:
            type: integer
            format: int64
            example: 12345
      requestBody:
        description: Upload completion payload with parts information
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadPayload'
      responses:
        '200':
          description: Successfully completed upload. Returns the media with its new
            file in `files`; other associations are not loaded on this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '400':
          description: Malformed request body or invalid media ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Media not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Upload

  /upload/abort:
    post:
      summary: Abort multipart upload
      description: |
        Cancel an in-progress multipart upload and clean up any uploaded parts. This helps prevent storage costs from incomplete uploads.

        ## Cleanup Process
        - Cancels the multipart upload in cloud storage
        - Removes any uploaded parts
        - No effect on media record (if created)
        - No effect on a version created by `POST /media/{id}/versions`: the empty version stays on the media
      operationId: abortS3MultipartUpload
      requestBody:
        description: Upload abort payload
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbortUploadPayload'
      responses:
        '200':
          description: Upload abort acknowledged. Returns `true` even when the
            storage-side abort fails (failures are logged server-side).
          content:
            application/json:
              schema:
                type: boolean
                example: true
        '400':
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Upload

  /media/{id}/versions:
    post:
      summary: Start a new version upload
      description: |
        Start uploading a file as a new version of an existing media. Use it to
        save an edit made outside ScorePlay (Photoshop, Lightroom) back onto the
        original: the media keeps its ID, name, tags, collection and access
        restrictions, and the file is added to its `versions`.

        ## Upload Process
        1. Call this endpoint to create the version and get upload parameters
        2. Upload the file parts with `PUT` to the returned `urls`, and keep the `ETag` header of each response
        3. Call `POST /media/{id}/versions/{version_id}/complete` with the key, upload ID and part ETags

        ScorePlay generates the previews of the new version (thumbnail,
        compressed, video proxy) after the upload completes. For companies with
        their own storage, the file is written to the customer bucket.

        The file type must match the media type: a photo media takes any
        non-video file (JPG, PNG, PSD, camera RAW), a video media only a video.

        To cancel, call `POST /upload/abort` with the returned `key` and
        `upload_id`. The version created by this call stays on the media without
        a file.

        Requires the `can_do_media_add_version` permission on your API key.
      operationId: startMediaVersionUploadPublic
      parameters:
        - name: id
          in: path
          description: ID of the media that receives the new version
          required: true
          schema:
            type: integer
            format: int64
            example: 624540
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartMediaVersionUploadPayload'
      responses:
        '200':
          description: Version created and multipart upload opened
          content:
            application/json:
              schema:
                type: object
                required:
                  - upload_id
                  - key
                  - urls
                  - media_id
                  - media_version_id
                properties:
                  upload_id:
                    type: string
                    description: Multipart upload ID, sent back on complete or abort
                    example: abc123xyz
                  key:
                    type: string
                    description: Storage key of the new version's original, sent back on complete or abort
                    example: 8/0/media_624540_252505.jpg
                  urls:
                    type: array
                    description: Pre-signed upload descriptors, one per part
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                          format: uri
                          description: Pre-signed URL to `PUT` this part to
                        etag:
                          type: string
                          description: Always empty on creation; read the `ETag` header of the `PUT` response instead
                          example: ""
                        parts_number:
                          type: integer
                          description: Part index this URL uploads
                          example: 1
                  media_id:
                    type: integer
                    description: ID of the media that receives the version
                    example: 624540
                  media_version_id:
                    type: integer
                    description: ID of the new version, used in the complete call
                    example: 252505
        '400':
          description: |
            Invalid request: missing `filename` or `parts`, `parts` above 10000,
            a version with the same name already exists on the media, or the file
            type does not match the media type (a video on a photo media, or the
            opposite)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: the file type does not match the media type photo
        '401':
          description: Unauthorized - invalid or missing API key, or the key lacks the
            `can_do_media_add_version` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Media not found, or not visible to your API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: MEDIA_NOT_FOUND
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Upload

  /media/{id}/versions/{version_id}/complete:
    post:
      summary: Complete a new version upload
      description: |
        Finalize the upload started with `POST /media/{id}/versions`. The file is
        attached to the version as its original, and ScorePlay starts generating
        its previews (thumbnail, compressed, video proxy). Previews are
        generated asynchronously: they appear in the version's `files` once
        processing is done.

        Set `make_default` to `true` to make the new version the default one,
        shown in the library, search and downloads. The default version only
        changes once the file is complete. Without it, the current default
        version stays and the new file is listed in `versions` only.

        Requires the `can_do_media_add_version` permission on your API key.
      operationId: completeMediaVersionUploadPublic
      parameters:
        - name: id
          in: path
          description: ID of the media
          required: true
          schema:
            type: integer
            format: int64
            example: 624540
        - name: version_id
          in: path
          description: The `media_version_id` returned by the start call
          required: true
          schema:
            type: integer
            format: int64
            example: 252505
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteMediaVersionUploadPayload'
      responses:
        '200':
          description: Upload completed. Returns the media with all its versions,
            in the same shape as `GET /media/{id}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Media'
        '400':
          description: |
            Invalid request: missing `key`, `upload_id` or `parts`, more than
            10000 parts, or a `key` that does not belong to this version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: key does not belong to this media version
        '401':
          description: Unauthorized - invalid or missing API key, or the key lacks the
            `can_do_media_add_version` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Media not found or not visible to your API key, or the
            version does not belong to this media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: MEDIA_VERSION_NOT_FOUND
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
        - Upload

  /video/logs:
    post:
      summary: Add video logs
      description: |
        Add action logs to videos for creating highlight clips and action analysis. This endpoint processes video timestamp data and creates action clips for sports analysis.

        ## Video Logs
        - Creates action clips with precise timestamps
        - Supports external ID matching for events
        - Generates searchable action metadata

        ## Timing Modes

        Each video log entry must use one of the following timing modes for the `log` object:

        | Mode | Fields | Description |
        |------|--------|-------------|
        | **Offset single** | `offset` | Single point offset in seconds from the start of the video |
        | **Offset range** | `start_offset` + `end_offset` | Offset range in seconds from the start of the video |
        | **Unix single** | `action_timestamp` | Unix timestamp in seconds for a single action point. Optionally include `start_timestamp`/`end_timestamp` for clip boundaries |
        | **Unix range** | `start_timestamp` + `end_timestamp` (no `action_timestamp`) | Unix timestamps in seconds defining a clip range |

        The unix modes are converted to offsets using the start timecode of the
        media's default (favourite) video version. If that timecode is wrong,
        correct it with `timecode` on `PUT /media/{id}/details` and send the
        logs again.

        ## Use Cases
        - Sports highlight generation
        - Video analysis and tagging
        - Action timestamp recording
      operationId: addVideoLogs
      requestBody:
        description: Video logs payload containing action data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoLogPayload'
      responses:
        '200':
          description: Successfully processed video logs
          content:
            application/json:
              schema:
                type: boolean
                example: true
        '400':
          description: Malformed JSON body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Server error, or an invalid payload (e.g. empty `video_logs`,
            a log with no timing fields, or an unknown `media_id`/`external_id`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - Video Logs

  /media/{id}/logs:
    get:
      summary: List video logs on a media
      description: |
        Retrieve the timecoded action logs attached to a video, in playback order.

        ## Timestamp units

        The three timing fields do **not** share a unit, and this mirrors how they are stored:

        | Field | Unit | Meaning |
        |-------|------|---------|
        | `timestamp` | **seconds** | Offset from the start of the video for the logged moment |
        | `start_timestamp` | **milliseconds** | Offset from the start of the video for the clip in-point (`0` if the log has no range) |
        | `end_timestamp` | **milliseconds** | Offset from the start of the video for the clip out-point (`0` if the log has no range) |

        Whichever timing mode you used on `POST /video/logs`, the log is stored resolved to
        offsets against the video, so unix timestamps sent at write time come back as offsets here.

        ## Preview assets

        `thumbnail_url`, `sprite_url` and `playback_url` point at the log's preview assets.
        They are produced asynchronously after the log is created, and again when its clip
        range changes, so each field is omitted while the assets are not ready yet and on
        logs that never had any generated. Use the URLs as returned.

        ## Pagination

        Results are ordered by `timestamp`, then `id`, so paging is stable. `limit` defaults to
        50 and is capped at 200; a larger value is clamped rather than rejected.
      operationId: listVideoLogsPublic
      tags:
        - Video Logs
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the media item
          schema:
            type: integer
            format: uint
            example: 12345
        - name: page
          in: query
          description: Page number, 1-based
          schema:
            type: integer
            default: 1
            example: 1
        - name: limit
          in: query
          description: Results per page (default 50, maximum 200)
          schema:
            type: integer
            default: 50
            maximum: 200
            example: 50
      responses:
        '200':
          description: Successfully retrieved the video logs. An empty `items` array
            means the media exists but has no logs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoLogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Media not found, or it belongs to another organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Delete video logs from a media
      description: |
        Delete specific action logs from a video. The log IDs go in the request body; there is
        no call that clears every log on a media at once.

        Only IDs that actually belong to this media are deleted, so an ID from another media
        (or one that no longer exists) is ignored rather than causing an error. The response
        lists what was really removed, so compare `deleted_ids` against what you sent if you
        need to confirm everything matched.

        Deleted logs are removed from search at the same time.
      operationId: deleteVideoLogsPublic
      tags:
        - Video Logs
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the media item
          schema:
            type: integer
            format: uint
            example: 12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteVideoLogsPayload'
      responses:
        '200':
          description: Logs deleted. `deleted_ids` holds the IDs that matched this media.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteVideoLogsResponse'
        '400':
          description: Malformed JSON body, or `log_ids` is missing or empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing API key, or the key lacks
            the `can_do_media_edit` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Media not found, or it belongs to another organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /video/logs/search:
    post:
      summary: Search video logs
      description: |
        Search the video logs across every media of your organization, optionally narrowed to
        one media or event (collection) and to the players, tag options and sponsors tagged on
        the logs. To read the logs of a single media in playback order, `GET /media/{id}/logs`
        is the simpler call.

        ## Filters

        All filters are optional; an empty body `{}` returns every log of the organization.
        Filters combine with AND, and so do the IDs inside each list: `"player_ids": [1, 2]`
        only returns logs tagged with **both** players. IDs that do not exist, or that belong
        to another organization, simply match nothing.

        ## Ordering

        Results are grouped by media, by descending media ID unless `order_type` is `asc`.
        Within a media, logs are always in playback order: by `start_timestamp`, then
        `timestamp`, then `end_timestamp`, then log ID.

        ## Timestamp units

        Same as `GET /media/{id}/logs`: `timestamp` is in **seconds**, `start_timestamp` and
        `end_timestamp` are in **milliseconds**, all offsets from the start of the video.

        ## Pagination

        Pagination is controlled by the `page` and `per_page` query parameters, not by the body.
        Defaults are page 1 and 100 results per page; `per_page` is capped at 200, and a larger
        value is clamped rather than rejected. The response echoes back the `page` and
        `per_page` applied, next to `count`, the total number of matching logs.
      operationId: searchVideoLogsPublic
      tags:
        - Video Logs
      parameters:
        - name: page
          in: query
          description: Page number, 1-based
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: per_page
          in: query
          description: Results per page (default 100, maximum 200)
          schema:
            type: integer
            minimum: 1
            default: 100
            maximum: 200
            example: 50
      requestBody:
        description: Search filters. Send `{}` to match every log.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchVideoLogsPayload'
      responses:
        '200':
          description: Successfully retrieved the matching video logs. An empty `logs` array
            means nothing matched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoLogSearchResult'
        '400':
          description: Malformed JSON body, or a non-numeric `page` or `per_page`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /video/logs/{id}:
    get:
      summary: Get a video log
      description: |
        Retrieve a single video log by its ID, in the same shape as one item of
        `POST /video/logs/search`. Timestamp units are the same as on the other video log
        endpoints: `timestamp` in seconds, `start_timestamp` and `end_timestamp` in milliseconds.
      operationId: getVideoLogPublic
      tags:
        - Video Logs
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the video log
          schema:
            type: integer
            format: uint
            example: 456
      responses:
        '200':
          description: Successfully retrieved the video log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoLogSearchEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Log not found, deleted, not attached to a media, or it belongs to
            another organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /operations:
