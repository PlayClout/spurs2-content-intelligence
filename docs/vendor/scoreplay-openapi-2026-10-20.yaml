  /media/{id}/transcripts:
    get:
      summary: Get a media's transcripts
      description: |
        Returns the source transcript and every translation held for a media, as timecoded
        segments with speaker labels.

        Transcription runs asynchronously after upload. Subscribe to the transcripts-ready
        webhook rather than polling, and call this endpoint once it fires.

        ## Usage
        - Omit `language` to receive every generated language in a single call.
        - Pass `language` to narrow the response to one of them.
      operationId: getMediaTranscripts
      tags:
        - Transcripts
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the media item
          schema:
            type: integer
            format: uint
            example: 12345
        - name: language
          in: query
          required: false
          description: Restrict the response to a single language. Accepts an ISO 639-1 code
            (`fr`) or the English language name (`french`).
          schema:
            type: string
            example: fr
      responses:
        '200':
          description: The media's transcripts. `transcripts` is empty when none have been
            generated yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaTranscripts'
        '400':
          description: Unsupported language
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing API key, or the key lacks the
            `can_do_media_view_transcription` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Media not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /media/{id}/transcripts/{language}:
    put:
      summary: Push a corrected transcript
      description: |
        Replaces the transcript for one language with your own corrected version - for example
        after a review pass that upgrades `Speaker 1` to a real name.

        The replacement is complete: the segments you send become the only segments for that
        language, so send the whole transcript every time. There is no partial update and no
        versioning. The call is idempotent and can be repeated as often as you need; the most
        recent push is the one users see.

        Pushing a language the media has no transcript for creates it, and it becomes the
        source transcript when it is the media's first.

        Once the push succeeds, regenerated files become available in the media's `attachments`:
        a `{language}_subtitle.srt` for each language, plus a `{language}_transcript.docx` for
        the source language.
      operationId: pushMediaTranscript
      tags:
        - Transcripts
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the media item
          schema:
            type: integer
            format: uint
            example: 12345
        - name: language
          in: path
          required: true
          description: Language of the transcript being pushed. Accepts an ISO 639-1 code
            (`fr`) or the English language name (`french`).
          schema:
            type: string
            example: fr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTranscriptRequest'
      responses:
        '200':
          description: The stored transcript
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
        '400':
          description: Unsupported language, or an invalid segment. Nothing is modified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Media not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

