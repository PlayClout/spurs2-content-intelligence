          description: Players referenced by the distribution rule. Null unless resolved.
          items:
            type: object
        rule_sponsors:
          type: array
          nullable: true
          description: Sponsors referenced by the distribution rule. Null unless resolved.
          items:
            type: object
        count:
          type: integer
          description: Computed usage counter. Only populated on some endpoints
