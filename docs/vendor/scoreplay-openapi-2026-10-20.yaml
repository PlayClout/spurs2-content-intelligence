    Sponsor:
      type: object
      description: Sponsor/brand entity
      properties:
        ID:
          type: integer
          description: Unique identifier for the sponsor
          example: 36692
        CreatedAt:
          type: string
          format: date-time
          description: Creation timestamp (ISO8601)
          example: 2025-03-19T15:01:17.593402Z
        UpdatedAt:
          type: string
          format: date-time
          description: Last update timestamp (ISO8601)
          example: 2025-03-19T15:01:17.685156Z
