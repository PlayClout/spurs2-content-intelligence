          type: string
          description: Automatic distribution format (e.g. massive.io). May be empty.
        distribution_path:
          type: string
          description: Automatic distribution destination path. May be empty.
        distribution_rule_raw:
          type: string
          description: Raw distribution rule expression. May be empty.
