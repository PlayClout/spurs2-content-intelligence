              example: OR
            rules:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                    example: tag_option_ids
                  operator:
                    type: string
                    example: contains
                  value:
                    description: Value compared by the rule (type depends on field)
        rule_events:
          type: array
          nullable: true
          description: Events referenced by the distribution rule. Null unless resolved.
