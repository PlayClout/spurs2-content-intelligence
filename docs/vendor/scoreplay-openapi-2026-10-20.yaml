openapi: 3.0.3
info:
  title: ScorePlay Media API
  version: 1.0.0
  description: |
    The ScorePlay Media API lets you search, enrich, transform, and deliver
    media assets programmatically — the same library that powers your apps,
    websites, and partner integrations.

    All requests authenticate with an `X-ScorePlay-Api-Key` header and are scoped
    to your organization. Responses are JSON; media search returns three
    quality tiers (photographer, compressed, thumbnail) plus dynamic image URLs.

    Use the **Try it** panel on any endpoint to call the live API with your key,
    or download the OpenAPI spec and a ready-to-import Postman collection from
    the Downloads menu.
  contact:
    name: ScorePlay API Support
    email: engineering@scoreplay.io

servers:
  - url: https://media.scoreplay.io/v1

security:
  - ApiKeyAuth: []

paths:
  /whoami:
    get:
      summary: Introspect your API key
      description: |
        Returns the identity, permissions, and content scope that your API key
        resolves to. Use this to verify a key is valid and to debug permission
        or visibility issues.
      operationId: getWhoami
      tags:
        - Authentication
      responses:
        '200':
          description: Identity and scope of the API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                    description: ID of the user the key resolves to
                    example: 42
                  user_type:
                    type: string
                    description: Type of the user (e.g. admin)
                    example: admin
                  company:
                    type: object
                    nullable: true
                    description: Organization the key belongs to, null when the user
                      has no company
                    properties:
                      name:
                        type: string
                        example: scoreplay
                      subdomain:
                        type: string
                        example: scoreplay
                  rights:
                    type: array
                    description: Permission names granted to the key
                    items:
                      type: string
                    example: ["can_view_media", "can_do_media_edit"]
                  scope:
                    type: object
                    description: Content visibility scope of the key
                    properties:
                      sponsor_id:
                        type: integer
                        description: Sponsor the key is restricted to, 0 when none
                      team_ids:
                        type: array
                        description: Teams the key is restricted to, empty when none
                        items:
                          type: integer
                      only_shared_content:
                        type: boolean
                        description: Whether the key only sees explicitly shared content
                      require_validation:
                        type: boolean
                        description: Whether the key only sees validated media
                      validator:
                        type: boolean
                        description: Whether the key can see non-validated media
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users:
    get:
      summary: List users
      description: |
        Retrieve the users of your organization, oldest first. The response is a paginated
        envelope carrying `items` and a `total` count, not a bare array. Each item has the
        same shape as [Get a user by ID](#tag/operation/getUserPublic).

        Requires the `can_view_users` permission on your API key.

        ## Filtering
        - `query` matches the user's first and last name as a substring, case- and
          accent-insensitively. It does not match the email.
        - `account_type_id` returns only the users of one
          [account type](#tag/operation/listAccountTypesPublic).
        - `external_group_id` returns only the members of one
          [external group](#tag/operation/listExternalGroupsPublic).
        - `status` returns only the users in one account status.
        - Filters combine: supplying several returns the users matching all of them.

        ## Notes
        - Users are ordered by creation date, oldest first, with the user ID breaking ties,
          so paging through the list is stable.
        - Deleted users are never returned.
        - `total` is omitted from the response when no user matches.
      operationId: listUsersPublic
      tags:
        - Users
      parameters:
        - name: query
          in: query
          description: Return only the users whose first or last name contains this string
          schema:
            type: string
            example: "dupont"
        - name: account_type_id
          in: query
          description: Return only the users of this account type
          schema:
            type: integer
            example: 3
        - name: external_group_id
          in: query
          description: Return only the members of this external group
          schema:
            type: integer
            example: 17
        - name: status
          in: query
          description: Return only the users in this account status
          schema:
            type: string
            enum: [validated, pending, refused, deactivated]
            example: validated
        - name: page
          in: query
          description: Page number, 1-based
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: limit
          in: query
          description: Number of users per page
          schema:
            type: integer
            minimum: 1
            default: 50
            example: 50
      responses:
        '200':
          description: Successfully retrieved users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '400':
          description: A non-numeric `account_type_id` or `external_group_id`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing API key, or the key lacks the
            `can_view_users` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}:
    get:
      summary: Get a user by ID
      description: |
        Retrieve a user within your organization: their name and email, account type,
        external group, and account status. The response is an explicit allowlist, so it
        never carries the phone number, password, or any token.

        Requires the `can_view_users` permission on your API key.

        ## Notes
        - A user ID belonging to another organization returns `404`, the same as one that
          doesn't exist or has been deleted — ids aren't enumerable.
        - `user_permission_id` / `user_permission_name` is the user's account type (what some
          systems call a "role"), as returned by
          [Get an account type by ID](#tag/operation/getAccountTypePublic).
        - `external_group_id` / `external_group_name` is the user's
          [external group](#tag/operation/getExternalGroupPublic). The underlying column is
          still named `sponsor_id` — these are the same concept, renamed for this response.

        ## Identifying who uploaded a media

        A common pairing: subscribe to the [`media.create`](/docs/webhooks/events) webhook
        (not `media.created`), call [Get media by ID](#tag/operation/getMediaByIdPublic) to
        read the uploader's `user_id`, then call this endpoint with that ID to decide what
        the uploader is and tag the media accordingly.
      operationId: getUserPublic
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
          description: User ID
          schema:
            type: integer
            example: 42
      responses:
        '200':
          description: Successfully retrieved the user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid user ID (non-numeric or zero)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing API key, or the key lacks the
            `can_view_users` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found - unknown ID, a user belonging to another
            organization, or a soft-deleted user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /account-types:
    get:
      summary: List account types
      description: |
        Retrieve the account types of your organization, ordered by name. An account type
        is the permission set a user is given (what some systems call a "role"). The
        response is a paginated envelope carrying `items` and a `total` count, not a bare
        array.

        Requires the `can_view_account_types` permission on your API key.

        ## Internal and external account types
        `is_external` separates account types for your own staff from those for people
        outside your organization, such as sponsors or rights holders. Users of an external
        account type only see the folders explicitly shared with them, and media shared
        with the whole organization is not shared with them.
        [External groups](#tag/operation/listExternalGroupsPublic) are usually given an
        external account type.

        ## Notes
        - `query` matches the account type name as a substring, case- and
          accent-insensitively.
        - `is_external=true` returns only external account types, `is_external=false` only
          internal ones. Omit it to get both.
        - `total` is omitted from the response when no account type matches.
      operationId: listAccountTypesPublic
      tags:
        - Account Types
      parameters:
        - name: query
          in: query
          description: Return only the account types whose name contains this string
          schema:
            type: string
            example: "partner"
        - name: is_external
          in: query
          description: Return only external (`true`) or only internal (`false`) account types
          schema:
            type: boolean
            example: true
        - name: page
          in: query
          description: Page number, 1-based
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: limit
          in: query
          description: Number of account types per page
          schema:
            type: integer
            minimum: 1
            default: 50
            example: 50
      responses:
        '200':
          description: Successfully retrieved account types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAccountTypes'
        '400':
          description: An `is_external` value that is not a boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing API key, or the key lacks the
            `can_view_account_types` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /account-types/{id}:
    get:
      summary: Get an account type by ID
      description: |
        Retrieve one account type of your organization, including the permissions it grants.
        This is the ID a user carries as `user_permission_id` and an external group carries
        as `account_type_id`.

        Requires the `can_view_account_types` permission on your API key.

        ## Notes
        - An account type ID belonging to another organization returns `404`, the same as
          one that doesn't exist.
      operationId: getAccountTypePublic
      tags:
        - Account Types
      parameters:
        - name: id
          in: path
          required: true
          description: Account type ID
          schema:
            type: integer
            example: 3
      responses:
        '200':
          description: Successfully retrieved the account type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountType'
        '400':
          description: Invalid account type ID (non-numeric or zero)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing API key, or the key lacks the
            `can_view_account_types` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Account type not found - unknown ID, or one belonging to another
            organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: USER_PERMISSION_NOT_FOUND
        '500':
          $ref: '#/components/responses/InternalServerError'

  /external-groups:
    post:
      summary: Create an external group
      description: |
        Create an external group in your organization. The group is created with its own
        access tag, so its members can see media as soon as it exists:
        - When the [account type](#tag/operation/listAccountTypesPublic) is named `sponsor`,
          the access tag points at the group itself: members see the media tagged with the
          group.
        - For any other account type, a tag option named after the group is created, and the
          access tag points at it.

        List what was created with
        [List an external group's access tags](#tag/operation/listExternalGroupAccessTagsPublic).

        Requires the `can_do_partners_edit` permission on your API key.

        ## Notes
        - `name` is trimmed and lowercased; `label` in the response keeps the name as sent.
        - Names are unique per organization: creating a group whose name already exists
          updates that group with the fields sent and returns it, instead of failing or
          creating a duplicate.
        - `active` defaults to `true` when omitted.
        - The response omits `account_type`; fetch the group with
          [Get an external group by ID](#tag/operation/getExternalGroupPublic) to read it.
        - An `account_type_id` belonging to another organization returns `404`, the same as
          one that doesn't exist.
      operationId: createExternalGroupPublic
      tags:
        - External Groups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExternalGroupRequest'
      responses:
        '201':
          description: External group created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalGroup'
              example:
                id: 17
                name: nike
                label: Nike
                account_type_id: 8
                active: true
                logo: https://example.com/nike-logo.png
                terms_and_conditions_url: ""
        '400':
          description: Malformed JSON body, a missing `name` or `account_type_id`, or a
            `logo` or `terms_and_conditions_url` that is not an http(s) URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing API key, or the key lacks the
            `can_do_partners_edit` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Account type not found - unknown `account_type_id`, or one belonging
            to another organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: USER_PERMISSION_NOT_FOUND
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: List external groups
      description: |
        Retrieve the external groups of your organization. An external group gathers
        people from outside your organization — a sponsor, a broadcaster, a rights holder —
        who see the media their access tags allow. The response
        is a paginated envelope carrying `items` and a `total` count, not a bare array.

        Requires the `can_view_partners` permission on your API key.

        ## Filtering
        - `query` matches the external group name as a substring, case- and
          accent-insensitively.
        - `account_type_id` returns only the external groups of one
          [account type](#tag/operation/listAccountTypesPublic).
        - `active` returns only active (`true`) or only inactive (`false`) external groups.
        - Filters combine: supplying several returns the external groups matching all of
          them.

        ## Notes
        - `name` and `user_type` are older names for `query` and `account_type_id`. They
          still work, but when both forms are sent the new one wins.
        - `total` is omitted from the response when no external group matches.
      operationId: listExternalGroupsPublic
      tags:
        - External Groups
      parameters:
        - name: query
          in: query
          description: Return only the external groups whose name contains this string
          schema:
            type: string
            example: "nike"
        - name: account_type_id
          in: query
          description: Return only the external groups of this account type
          schema:
            type: integer
            example: 8
        - name: active
          in: query
          description: Return only active (`true`) or only inactive (`false`) external groups
          schema:
            type: boolean
            example: true
        - name: name
          in: query
          deprecated: true
          description: Former name of `query`
          schema:
            type: string
        - name: user_type
          in: query
          deprecated: true
          description: Former name of `account_type_id`
          schema:
            type: integer
        - name: page
          in: query
          description: Page number, 1-based
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
        - name: limit
          in: query
          description: Number of external groups per page
          schema:
            type: integer
            minimum: 1
            default: 50
            example: 50
      responses:
        '200':
          description: Successfully retrieved external groups
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExternalGroups'
        '400':
          description: A non-numeric `account_type_id`, or an `active` value that is not a
            boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing API key, or the key lacks the
            `can_view_partners` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /external-groups/{id}:
    get:
      summary: Get an external group by ID
      description: |
        Retrieve one external group of your organization. This is the ID a user carries as
        `external_group_id`.

        Requires the `can_view_partners` permission on your API key.

        ## Notes
        - An external group ID belonging to another organization returns `404`, the same as
          one that doesn't exist.
      operationId: getExternalGroupPublic
      tags:
        - External Groups
      parameters:
        - name: id
          in: path
          required: true
          description: External group ID
          schema:
            type: integer
            example: 17
      responses:
        '200':
          description: Successfully retrieved the external group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalGroup'
        '400':
          description: Invalid external group ID (non-numeric or zero)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing API key, or the key lacks the
            `can_view_partners` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: External group not found - unknown ID, or one belonging to another
            organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Update an external group
      description: |
        Rename, activate or deactivate an external group, or change its logo or terms and
        conditions URL. Only the fields sent are changed; send at least one.

        Requires the `can_do_partners_edit` permission on your API key.

        ## Notes
        - `name` is trimmed and lowercased, and `label` becomes the name as sent, like on
          [create](#tag/operation/createExternalGroupPublic). Renaming never merges into
          another group: a name already used by another group in your organization returns
          `409`.
        - Empty strings are ignored, so `logo` and `terms_and_conditions_url` cannot be
          cleared here. Remove the logo with
          [Remove an external group's logo](#tag/operation/deleteExternalGroupLogoPublic).
        - `account_type_id` cannot be changed: it decided the shape of the group's access
          tags when the group was created.
        - An external group ID belonging to another organization returns `404`, the same as
          one that doesn't exist.
      operationId: updateExternalGroupPublic
      tags:
        - External Groups
      parameters:
        - name: id
          in: path
          required: true
          description: External group ID
          schema:
            type: integer
            example: 17
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExternalGroupRequest'
            example:
              name: Nike Football
              active: false
      responses:
        '200':
          description: External group updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalGroup'
              example:
                id: 17
                name: nike football
                label: Nike Football
                account_type_id: 8
                account_type: sponsor
                active: false
                logo: https://example.com/nike-logo.png
                terms_and_conditions_url: ""
        '400':
          description: Invalid external group ID, malformed JSON body, no field to update,
            or a `logo` or `terms_and_conditions_url` that is not an http(s) URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: no fields to update
        '401':
          description: Unauthorized - invalid or missing API key, or the key lacks the
            `can_do_partners_edit` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: External group not found - unknown ID, or one belonging to another
            organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Another external group of your organization already has this name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: an external group with this name already exists
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Delete an external group
      description: |
        Delete an external group together with its media tags, access tags, user tags and
        user group tags. It is a soft delete: the records are marked deleted, not removed.

        Requires the `can_do_partners_delete` permission on your API key.

        ## Notes
        - A group that still has active users cannot be deleted and returns `409`. Delete
          those users, or detach them from the group, first. Media tags and access tags do
          not block the delete.
        - An external group ID belonging to another organization returns `404`, the same as
          one that doesn't exist.
      operationId: deleteExternalGroupPublic
      tags:
        - External Groups
      parameters:
        - name: id
          in: path
          required: true
          description: External group ID
          schema:
            type: integer
            example: 17
      responses:
        '204':
          description: External group deleted successfully
        '400':
          description: Invalid external group ID (non-numeric or zero)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing API key, or the key lacks the
            `can_do_partners_delete` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: External group not found - unknown ID, or one belonging to another
            organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The external group still has active users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: external group still has 3 active users
        '500':
          $ref: '#/components/responses/InternalServerError'

  /external-groups/{id}/logo:
    delete:
      summary: Remove an external group's logo
      description: |
        Clear an external group's logo. Its `logo` is empty afterwards. Set a new one with
        [Update an external group](#tag/operation/updateExternalGroupPublic).

        Requires the `can_do_partners_edit` permission on your API key.

        ## Notes
        - Removing the logo of a group that has none still returns `204`.
        - An external group ID belonging to another organization returns `404`, the same as
          one that doesn't exist.
      operationId: deleteExternalGroupLogoPublic
      tags:
        - External Groups
      parameters:
        - name: id
          in: path
          required: true
          description: External group ID
          schema:
            type: integer
            example: 17
      responses:
        '204':
          description: Logo removed successfully
        '400':
          description: Invalid external group ID (non-numeric or zero)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing API key, or the key lacks the
            `can_do_partners_edit` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: External group not found - unknown ID, or one belonging to another
            organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /external-groups/{id}/access-tags:
    get:
      summary: List an external group's access tags
      description: |
        Retrieve the access tags of one external group. Access tags decide which media the
        group's members can see: each one points at a tag option, a player, or another
        external group, and its `type` says how it combines with the others.

        Requires the `can_view_partners` permission on your API key.

        ## Notes
        - The response is a bare array, not a paginated envelope.
        - Access tags keep the database casing for their base fields (`ID`, `CreatedAt`,
          `UpdatedAt`, `DeletedAt`).
        - An external group ID belonging to another organization returns `404`, the same as
          one that doesn't exist.
      operationId: listExternalGroupAccessTagsPublic
      tags:
        - External Groups
      parameters:
        - name: id
          in: path
          required: true
          description: External group ID
          schema:
            type: integer
            example: 17
      responses:
        '200':
          description: Successfully retrieved the access tags. An external group without
            access tags returns an empty array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessTag'
        '400':
          description: Invalid external group ID (non-numeric or zero)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing API key, or the key lacks the
            `can_view_partners` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: External group not found - unknown ID, or one belonging to another
            organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tag/search:
    get:
      summary: Search for public tags, players, and sponsors
      description: |
        Search for tags, players, and sponsors within a company. This endpoint supports text-based search with optional language filtering and external ID lookups.

        ## Usage
        - Use `query` parameter to search by name/text
        - Use `external_id` parameter to find players by external identifier

      operationId: searchPublicTags
      parameters:
        - name: query
          in: query
          description: Search query string to match against tag names, player names, and
            sponsor labels. Maximum 60 characters.
          schema:
            type: string
            maxLength: 60
            example: goal
        - name: language
          in: query
          description: Language code for filtering tag results. Maximum 10 characters.
          schema:
            type: string
            maxLength: 10
            example: en
        - name: external_id
          in: query
          description: External identifier for player lookup. Maximum 100 characters.
          schema:
            type: string
            maxLength: 100
            example: player123
      responses:
        '200':
          description: Successfully retrieved search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags:
                    type: array
