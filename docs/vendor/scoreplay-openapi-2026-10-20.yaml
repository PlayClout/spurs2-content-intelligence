  /media/{id}/details:
    put:
      summary: Update media details
      description: >-
        Updates the details of a specific media item. Only the fields you send
        are changed.


        For videos you can also correct the start timecode with `timecode`.
        Pass `media_version_id` alongside it to target a specific version of the
        video; without it the media's default (favourite) version is updated.


        Changing `event_id` here only re-files the media: it does not touch its
        tags. To move media to another event and swap the event-derived tags in
        one call, use `POST /media/move`.
      operationId: updatePublicMediaDetails
      tags:
        - Media
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the media item
          schema:
            type: integer
            format: uint
            example: 12345
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicMediaUpdatePayload'
      responses:
        '204':
          description: Media details updated successfully (No Content)
        '400':
          description: >-
            Bad request - invalid input data, a malformed or out-of-range
            `timecode`, or `media_version_id` sent without `timecode` or set
            to `0`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing API key, or the key lacks
            the `can_do_media_edit` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Media not found, a referenced `event_id`/`label_id` does not
            exist for your organization, or the `media_version_id` does not
            belong to this media (`MEDIA_VERSION_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /media/move:
    post:
      summary: Move media to another event
      description: >-
        Moves up to 500 media into another event (collection) and swaps their
        event-derived tags in one call. The previous event's tags (its tag
        options, team and season tags, and the teams' extra tag options) are
        removed, and the destination event's tags (tag options, team, season,
        players and sponsors) are added. All other tags, including existing
        player and sponsor tags, are kept.


        The move runs asynchronously: the call returns `202` with an
        `operation_id`, which you poll with `GET /operation/{id}` until its
        `status` is `done` or `error`. Duplicate IDs are ignored. Media that
        have no files cannot be moved and end the operation in `error`.
      operationId: moveMedia
      tags:
        - Media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaMoveRequest'
      responses:
        '202':
          description: Move accepted; poll the operation for its outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaMoveAccepted'
        '400':
          description: Bad request - `event_id` missing, or `media_ids` empty,
            over 500 entries, or containing `0`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - invalid or missing API key, or the key lacks
            the `can_do_media_edit` permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The event, or at least one of the media, does not exist
            for your organization. Nothing is moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /operation/{id}:
    get:
      summary: Get operation status
