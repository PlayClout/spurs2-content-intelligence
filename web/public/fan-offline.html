<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050811">
<title>Spursx2 AI - offline</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050811;color:#f5f5f3;font-family:Inter,system-ui,sans-serif;padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom)}
  main{max-width:360px;text-align:center}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-family:"Arial Narrow",Inter,sans-serif;font-style:italic;text-transform:uppercase;font-size:30px;line-height:.95;margin:18px 0 8px}
  p{color:#8b93a3;font-size:15px;line-height:1.5}
  button{margin-top:12px;min-height:44px;padding:0 22px;border:0;border-radius:999px;background:#126bff;color:#fff;font-weight:700;font-size:15px}
</style>
</head>
<body>
<main>
  <img src="/icons/fan-192.png" alt="">
  <h1>You're offline</h1>
  <p>Clips need a connection. Nothing from the club catalog is saved on this device, so reconnect to see the latest approved clips.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
