<!-- @dsCard group="Components" viewport="700x460" name="Buttons & Icons" subtitle="CTA families, sizes, states + the 27-glyph icon set" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--clout-black);color:var(--clout-white);font-family:var(--font-body);padding:28px 30px}
  h3{font-family:var(--font-body);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--clout-blue-tint);margin:0 0 14px}
  .row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:26px}
  .icons{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Button, Icon, ICON_NAMES } = window.CloutDesignSystem_49ec9a;
function Card(){
  return (<div>
    <h3>CTA Families · Large</h3>
    <div className="row">
      <Button family="primary">Join Now</Button>
      <Button family="secondary">Learn More</Button>
      <Button family="dark">Enter</Button>
      <Button family="outline">Skip</Button>
    </div>
    <h3>Small · States</h3>
    <div className="row">
      <Button family="primary" size="small">Join</Button>
      <Button family="primary" size="small" disabled>Closed</Button>
      <Button family="secondary" size="small" icon="chevron-right">Details</Button>
      <Button family="outline" size="small" showArrow={false}>Dismiss</Button>
    </div>
    <h3>Icon Set · 27 glyphs</h3>
    <div className="icons">
      {ICON_NAMES.map(n => <Icon key={n} name={n} size={26} />)}
      <Icon name="bolt" size={26} color="var(--clout-electric-blue)" />
      <Icon name="fire" size={26} color="var(--clout-pink)" />
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script>
</body>
</html>
