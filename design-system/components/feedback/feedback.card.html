<!-- @dsCard group="Components" viewport="700x520" name="Feedback" subtitle="Alerts, toasts, progress, spinners, skeletons, empty states" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--bg-canvas);color:var(--fg-default);font-family:var(--font-body);padding:26px 30px}
  h3{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-accent);margin:22px 0 12px}
  h3:first-child{margin-top:0}
  .col{display:flex;flex-direction:column;gap:12px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
</style></head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { InlineAlert, Toast, Progress, Spinner, Skeleton, SkeletonText, EmptyState, Icon, Button } = window.CloutDesignSystem_49ec9a;
function Demo(){
  return (<div>
    <h3>Inline alerts</h3>
    <div className="col">
      <InlineAlert status="success" title="Prize claimed">$500 is on its way to your linked account.</InlineAlert>
      <InlineAlert status="warning" title="Picks lock in 12 minutes" onDismiss={()=>{}}>Lock them in to stay eligible.</InlineAlert>
      <InlineAlert status="error" title="Payment failed">Update your card to keep your pass active.</InlineAlert>
    </div>
    <h3>Toasts</h3>
    <div className="col">
      <Toast status="success" title="Pick submitted" onDismiss={()=>{}}>You're in the Sunday Slate.</Toast>
      <Toast status="info" title="New challenge live" onDismiss={()=>{}}>Double XP until kickoff.</Toast>
    </div>
    <h3>Progress · loading</h3>
    <div className="two">
      <div className="col">
        <Progress label="Pass progress" valueLabel="1,240 / 2,000 XP" value={62} />
        <Progress label="Challenge" valueLabel="Complete" value={100} tone="success" size="sm" />
        <Progress label="Uploading" indeterminate size="sm" tone="accent" />
      </div>
      <div className="col">
        <div style={{display:'flex',gap:16,alignItems:'center'}}><Spinner size={20}/><Spinner size={28} tone="action"/><Spinner size={20} tone="neutral"/></div>
        <div style={{display:'flex',gap:12,alignItems:'center'}}><Skeleton circle height={40}/><div style={{flex:1}}><SkeletonText lines={2}/></div></div>
      </div>
    </div>
    <h3>Empty state</h3>
    <EmptyState compact icon={<Icon name="target" size={26} color="currentColor"/>} title="No picks yet"
      description="Enter a contest to start building your streak."
      action={<Button size="small">Browse contests</Button>} />
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
