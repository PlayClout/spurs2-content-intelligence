<!-- @dsCard group="Components" viewport="700x340" name="Badges" subtitle="Achievement, tier, verification, placement & XP badges" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;background:var(--clout-black);color:var(--clout-white);font-family:var(--font-body);padding:30px}
  .row{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end;justify-content:center}
  .cell{display:flex;flex-direction:column;align-items:center;gap:12px}
  .cap{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--clout-slate-dim)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Badge } = window.CloutDesignSystem_49ec9a;
const items = [
  {shape:'circle', title:'MVP', subtitle:'AWARD', rim:'action', cap:'Achievement'},
  {shape:'square', title:'GOLD', subtitle:'TIER', rim:'atmosphere', cap:'Rank Tier'},
  {shape:'shield', title:'PRO', subtitle:'VERIFIED', rim:'atmosphere', cap:'Verification'},
  {shape:'ribbon', title:'1ST', subtitle:'PLACE', rim:'action', cap:'Placement'},
  {shape:'hexagon', title:'XP MAX', subtitle:'MILESTONE', rim:'atmosphere', cap:'XP Reward'},
];
function Card(){
  return (<div className="row">
    {items.map(it => (
      <div className="cell" key={it.shape}>
        <Badge shape={it.shape} title={it.title} subtitle={it.subtitle} rim={it.rim} size={150} />
        <span className="cap">{it.cap}</span>
      </div>
    ))}
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script>
</body>
</html>
