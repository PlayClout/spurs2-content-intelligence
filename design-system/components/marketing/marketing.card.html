<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script type="text/babel">
const { PrizeCard, PriceTag, PassTag, StatChip, StatusBadge, Countdown, Divider } = window.CloutDesignSystem_49ec9a;
function Card(){
  return (<div>
    <div className="row" style={{alignItems:'stretch'}}>
      <PrizeCard kicker="WIN A" value="$500" label="GIFT CARD" />
      <div style={{display:'flex',flexDirection:'column',gap:18,justifyContent:'center'}}>
        <PriceTag label="IN PRIZES" value="$10,000" />
        <div className="row"><PassTag name="OPEN PASS" /></div>
      </div>
    </div>
    <h3>Stats · Status · Countdown</h3>
    <div className="row">
      <StatChip value="$50K" label="TOTAL PRIZES" />
      <StatChip value="12,480" label="PLAYERS" valueColor="var(--clout-white)" />
      <StatusBadge status="live" />
      <StatusBadge status="new" />
      <StatusBadge status="ending" />

    <div className="row" style={{marginTop:18}}>
      <Countdown days={2} hours={14} minutes={30} />

}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
