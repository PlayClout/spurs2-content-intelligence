<!-- @dsCard group="Type" viewport="700x300" name="Hierarchy" subtitle="Kicker → prize value → offer → pass → CTA → fine print" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--clout-black);padding:24px 30px;color:var(--clout-white)}
  .kick{font-family:var(--font-body);font-weight:700;font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:var(--clout-hyper-blue)}
  .val{font-family:var(--font-display);font-style:italic;font-weight:700;font-size:80px;line-height:.9;text-transform:uppercase;background:var(--clout-gradient-action);-webkit-background-clip:text;background-clip:text;color:transparent;margin:4px 0}
  .offer{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:30px;text-transform:uppercase}
  .pass{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:20px;text-transform:uppercase;color:var(--clout-signal-orange);border-bottom:2px solid var(--clout-signal-orange);display:inline-block;padding-bottom:2px;margin-top:8px}
  .cta{font-family:var(--font-display);font-style:italic;font-weight:700;font-size:18px;text-transform:uppercase;display:inline-block;background:var(--clout-gradient-action);color:#fff;padding:10px 22px;border-radius:999px;margin-top:14px}
  .fine{font-family:var(--font-body);font-size:11px;color:var(--clout-slate-dim);margin-top:12px}
</style></head><body>
  <div class="kick">WIN A</div>
  <div class="val">$10,000</div>
  <div class="offer">PGA Superstore Gift Card</div><br>
  <span class="pass">JOIN THE OPEN PASS</span>
  <div><span class="cta">Join Now →</span></div>
  <div class="fine">No purchase necessary. Terms apply. 18+.</div>
</body></html>
