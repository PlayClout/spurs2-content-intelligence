<!-- @dsCard group="Colors" viewport="700x150" name="Extended Neon" subtitle="Deeper accents for atmosphere, glow & high energy" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--clout-black);font-family:var(--font-body);padding:20px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .sw{border-radius:12px;height:110px;border:1px solid var(--border-hairline);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box}
  .n{color:#fff;font-weight:700;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .h{color:rgba(255,255,255,.82);font-size:11px;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px rgba(0,0,0,.6)}
</style></head><body>
  <div class="sw" style="background:var(--clout-deep-navy)"><span class="n">Deep Navy</span><span class="h">#071A3D</span></div>
  <div class="sw" style="background:var(--clout-hyper-blue)"><span class="n">Hyper Blue</span><span class="h">#00A3FF</span></div>
  <div class="sw" style="background:var(--clout-violet)"><span class="n">Violet</span><span class="h">#7047EB</span></div>
  <div class="sw" style="background:var(--clout-electric-magenta)"><span class="n">Electric Magenta</span><span class="h">#D900FF</span></div>
  <div class="sw" style="background:var(--clout-hot-coral)"><span class="n">Hot Coral</span><span class="h">#FF3157</span></div>
</body></html>
