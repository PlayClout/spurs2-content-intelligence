<!-- @dsCard group="Brand" viewport="700x180" name="Elevation & Glow" subtitle="Dark-UI shadows + single signature glows" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--clout-black);font-family:var(--font-body);padding:26px 22px;display:flex;gap:22px;align-items:center;justify-content:center;flex-wrap:wrap}
  .cell{display:flex;flex-direction:column;align-items:center;gap:12px}
  .box{width:110px;height:70px;border-radius:14px;background:var(--clout-carbon);border:1px solid var(--border-hairline)}
  .lbl{color:var(--clout-white);font-size:11px;font-weight:600}
</style></head><body>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-panel)"></div><span class="lbl">Panel</span></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-card)"></div><span class="lbl">Card</span></div>
  <div class="cell"><div class="box" style="box-shadow:var(--shadow-float)"></div><span class="lbl">Float</span></div>
  <div class="cell"><div class="box" style="box-shadow:var(--glow-blue)"></div><span class="lbl">Glow · Blue</span></div>
  <div class="cell"><div class="box" style="box-shadow:var(--glow-pink)"></div><span class="lbl">Glow · Pink</span></div>
</body></html>
