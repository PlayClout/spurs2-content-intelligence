<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--clout-black);font-family:var(--font-body);padding:22px 30px;display:flex;gap:22px;align-items:flex-end}
  .cell{display:flex;flex-direction:column;align-items:center;gap:10px}
  .box{width:110px;height:80px;background:var(--clout-carbon);border:1.5px solid var(--border-blue)}
  .lbl{color:var(--clout-white);font-size:12px;font-weight:600}
  .sub{color:var(--clout-slate-dim);font-size:10px}
</style></head><body>
  <div class="cell"><div class="box" style="border-radius:8px"></div><span class="lbl">sm · 8</span></div>
  <div class="cell"><div class="box" style="border-radius:14px"></div><span class="lbl">chip · 14</span></div>
  <div class="cell"><div class="box" style="border-radius:16px"></div><span class="lbl">tag · 16</span></div>
  <div class="cell"><div class="box" style="border-radius:22px"></div><span class="lbl">card · 22</span></div>
  <div class="cell"><div class="box" style="border-radius:999px"></div><span class="lbl">pill · full</span></div>
</body></html>
