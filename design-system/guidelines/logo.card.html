<!-- @dsCard group="Brand" viewport="700x220" name="Logo — Wordmark & Symbol" subtitle="White/reversed masters on dark & atmospheric backgrounds" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--clout-black);font-family:var(--font-body);padding:0;display:grid;grid-template-columns:1.4fr 1fr;grid-auto-rows:1fr;gap:0}
  .cell{display:flex;align-items:center;justify-content:center;gap:16px;padding:24px;position:relative}
  .b1{background:var(--clout-black);border-right:1px solid var(--border-hairline);border-bottom:1px solid var(--border-hairline)}
  .b2{background:var(--clout-splitlight);border-bottom:1px solid var(--border-hairline)}
  .b3{background:var(--clout-carbon);border-right:1px solid var(--border-hairline)}
  .b4{background:var(--clout-gradient-atmosphere)}
  .tag{position:absolute;top:10px;left:14px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5)}
  img.wm{height:38px}img.sym{height:60px}
</style></head><body>
  <div class="cell b1"><span class="tag">Wordmark · on black</span><img class="wm" src="../assets/logo/clout_wordmark_white.svg" alt="Clout"></div>
  <div class="cell b3"><span class="tag">Symbol · C</span><img class="sym" src="../assets/logo/clout_symbol_white.svg" alt="C"></div>
  <div class="cell b2"><span class="tag">Wordmark · split-light</span><img class="wm" src="../assets/logo/clout_wordmark_white.svg" alt="Clout"></div>
  <div class="cell b4"><span class="tag" style="color:rgba(5,8,17,.6)">Symbol · atmosphere</span><img class="sym" src="../assets/logo/clout_symbol_white.svg" alt="C"></div>
</body></html>
