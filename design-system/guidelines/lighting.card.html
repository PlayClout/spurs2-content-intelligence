<!-- @dsCard group="Brand" viewport="700x200" name="Lighting & Atmosphere" subtitle="Split-light · blue signature · one localized glow · clean center" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--clout-black);font-family:var(--font-body);padding:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .cell{height:150px;border-radius:14px;border:1px solid var(--border-hairline);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:12px;box-sizing:border-box}
  .lbl{color:#fff;font-size:11px;font-weight:600;letter-spacing:.04em;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.7)}
  .split{background:var(--clout-splitlight)}
  .blue{background:radial-gradient(90% 90% at 30% 20%,rgba(18,107,255,.5),rgba(18,107,255,0) 60%),var(--clout-black)}
  .glow{background:var(--clout-black)}
  .orb{position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);width:64px;height:64px;border-radius:50%;background:var(--clout-gradient-action);box-shadow:var(--glow-pink)}
</style></head><body>
  <div class="cell split"><span class="lbl">Split-light · cool ↔ warm</span></div>
  <div class="cell blue"><span class="lbl">Blue-forward signature</span></div>
  <div class="cell glow"><div class="orb"></div><span class="lbl">One localized bloom</span></div>
</body></html>
