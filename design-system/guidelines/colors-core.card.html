<!-- @dsCard group="Colors" viewport="700x170" name="Core Palette" subtitle="Dark foundation · white text · blue signature · warm action" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--clout-black);font-family:var(--font-body);padding:20px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
  .sw{border-radius:12px;height:130px;border:1px solid var(--border-hairline);display:flex;flex-direction:column;justify-content:flex-end;padding:12px;box-sizing:border-box}
  .n{color:#fff;font-weight:700;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .h{color:rgba(255,255,255,.8);font-size:11px;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px rgba(0,0,0,.6)}
  .r{color:rgba(255,255,255,.55);font-size:9px;letter-spacing:.05em;text-transform:uppercase;margin-top:2px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
</style></head><body>
  <div class="sw" style="background:var(--clout-black)"><span class="n">Clout Black</span><span class="h">#050811</span><span class="r">Foundation</span></div>
  <div class="sw" style="background:var(--clout-carbon)"><span class="n">Carbon</span><span class="h">#10131C</span><span class="r">Panels</span></div>
  <div class="sw" style="background:var(--clout-white)"><span class="n" style="color:#050811;text-shadow:none">Clout White</span><span class="h" style="color:#333;text-shadow:none">#F5F5F3</span><span class="r" style="color:#666;text-shadow:none">Text</span></div>
  <div class="sw" style="background:var(--clout-electric-blue)"><span class="n">Electric Blue</span><span class="h">#126BFF</span><span class="r">Signature</span></div>
  <div class="sw" style="background:var(--clout-pink)"><span class="n">Clout Pink</span><span class="h">#FF006B</span><span class="r">Action / Value</span></div>
  <div class="sw" style="background:var(--clout-signal-orange)"><span class="n">Signal Orange</span><span class="h">#FF6A1A</span><span class="r">Energy / CTA</span></div>
</body></html>
