<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--clout-black);font-family:var(--font-body);padding:22px 30px;color:var(--clout-white)}
  .r{display:flex;align-items:center;gap:14px;margin-bottom:9px}
  .lbl{width:70px;font-size:11px;color:var(--clout-slate-dim);font-variant-numeric:tabular-nums;flex:none}
  .bar{height:14px;background:var(--clout-gradient-action);border-radius:3px}
</style></head><body>
  <div class="r"><span class="lbl">4 · s1</span><span class="bar" style="width:4px"></span></div>
  <div class="r"><span class="lbl">8 · s2</span><span class="bar" style="width:8px"></span></div>
  <div class="r"><span class="lbl">12 · s3</span><span class="bar" style="width:12px"></span></div>
  <div class="r"><span class="lbl">16 · s4</span><span class="bar" style="width:16px"></span></div>
  <div class="r"><span class="lbl">24 · s6</span><span class="bar" style="width:24px"></span></div>
  <div class="r"><span class="lbl">32 · s8</span><span class="bar" style="width:32px"></span></div>
  <div class="r"><span class="lbl">48 · s12</span><span class="bar" style="width:48px"></span></div>
  <div class="r"><span class="lbl">64 · s16</span><span class="bar" style="width:64px"></span></div>
  <div class="r"><span class="lbl">96 · s24</span><span class="bar" style="width:96px"></span></div>
  <div class="r"><span class="lbl">128 · s32</span><span class="bar" style="width:128px"></span></div>
</body></html>
