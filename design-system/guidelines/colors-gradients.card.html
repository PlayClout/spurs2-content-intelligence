<!-- @dsCard group="Colors" viewport="700x200" name="Gradients" subtitle="Action · Atmosphere · Split-Light (a lighting method)" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--clout-black);font-family:var(--font-body);padding:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .g{border-radius:14px;height:150px;border:1px solid var(--border-hairline);display:flex;flex-direction:column;justify-content:flex-end;padding:14px;box-sizing:border-box;overflow:hidden}
  .n{color:#fff;font-weight:700;font-size:13px}
  .h{color:rgba(255,255,255,.85);font-size:10px;margin-top:3px}
</style></head><body>
  <div class="g" style="background:var(--clout-gradient-action)"><span class="n" style="color:#050811">Action</span><span class="h" style="color:rgba(5,8,17,.75)">#FF006B → #FF3157 → #FF6A1A</span></div>
  <div class="g" style="background:var(--clout-gradient-atmosphere)"><span class="n">Atmosphere</span><span class="h">#126BFF → #7047EB → #FF006B</span></div>
  <div class="g" style="background:var(--clout-splitlight)"><span class="n">Split-Light</span><span class="h">cool ↔ warm over dark center</span></div>
</body></html>
