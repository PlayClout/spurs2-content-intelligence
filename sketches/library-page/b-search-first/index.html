<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library · Spursx2 AI (mockup B)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared.css">
<script src="../inventory.js"></script>
</head>
<body class="variant-b">
<div class="app">
  <aside class="side">
    <button class="org" id="org" title="Switch club"><span class="crest" id="crest"></span><span><b id="orgName"></b><small id="orgLeague"></small></span><span class="chev">⌄</span></button>
    <nav>
      <a class="nav" data-only="tottenham-hotspur"><span class="i">◉</span>Live match</a>
      <a class="nav"><span class="i">▤</span>Inbox<span class="count">14</span></a>
      <a class="nav active"><span class="i">▦</span>Library</a>
      <a class="nav"><span class="i">✓</span>Approved<span class="count">3</span></a>
      <a class="nav"><span class="i">↑</span>Published</a>
      <a class="nav"><span class="i">▣</span>Montages</a>
      <p class="sect">Workspace</p>
      <a class="nav"><span class="i">⚙</span>Settings</a>
    </nav>
    <div class="foot"><span class="dot ok"></span>All systems live · 4 ms</div>
  </aside>

  <div class="main">
    <header class="top">
      <span class="topTitle">Library</span>
      <div class="right"><span class="pill tone-blue" id="indexPill"></span></div>
    </header>

    <div class="body bodyB">
      <section class="content">
        <form class="heroSearch" id="searchForm">
          <span class="mag">⌕</span>
          <input id="q" placeholder="Describe the moment you want…" autocomplete="off">
          <button class="btn primary" type="submit">Search</button>
        </form>
        <div class="chips" id="chips"></div>
        <div class="tabsRow">
          <div class="tabs" id="tabs" role="tablist"></div>
        </div>
        <div class="contentHead slim"><div><h1 id="title"></h1><p class="sub" id="subtitle"></p></div></div>
        <div id="grid" class="grid"></div>
        <div id="more" class="more"></div>
      </section>

      <aside class="drawer" id="drawer" hidden>
        <button class="x" id="closeDrawer" aria-label="Close">×</button>
        <div class="thumb big" id="dThumb"></div>
        <p class="kicker" id="dKicker"></p>
        <h2 id="dTitle"></h2>
        <dl class="facts" id="dFacts"></dl>
        <div id="dTrim" class="trim"></div>
        <label class="field">Make it a
          <select id="dFormat"><option>Reel + photo card (default)</option><option>Reel only</option><option>Photo card only</option></select>
        </label>
        <button class="btn primary wide" id="dMake">Make clip</button>
        <p class="note">Runs the normal pipeline: Pegasus checks the moment, rights are screened, and a draft lands in the Inbox for approval. Nothing is published.</p>
      </aside>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
  // Variant B: search-first. Big search + suggested queries on top, collections as tabs below.
  window.VARIANT = "search";
</script>
<script src="../shared.js"></script>
</body>
</html>
